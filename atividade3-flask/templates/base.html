<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}BURGIVO{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='img/logo.png') }}">
</head>


<body>

    <header>
        <nav class="navbar navbar-expand-md navbar-dark">
            <div class="container">
                <a class="navbar-brand" href="{{ url_for('index') }}">
                    <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo BURGIVO" class="logo">
                    BURGIVO
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                    <span class="navbar-toggler-icon"></span>
                </button>
                
                <div class="collapse navbar-collapse" id="menu">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="{{ url_for('quem_somos') }}">Quem somos</a></li>
                        <li class="nav-item"><a class="nav-link" href="{{ url_for('contatos') }}">Contatos</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>


    {% block conteudo %}{% endblock %}

    <a href="https://wa.me/5512911112222" class="whatsapp" target="_blank">💬 Peça pelo WhatsApp</a>

    <footer>
        <p class="mb-0">© 2026 BURGIVO - Hambúrguer artesanal</p>
        <p class="mb-0">Karina Martins Molina - Atividade 3</p>
    </footer>

    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
