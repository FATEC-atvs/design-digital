<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contatos - BURGIVO</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>


<body>

    <header>
        <nav class="navbar navbar-expand-md navbar-dark">
            <div class="container">
                <a class="navbar-brand" href="index.html"> BURGIVO </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="menu">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="quem_somos.html">Quem somos</a></li>
                        <li class="nav-item"><a class="nav-link" href="contatos.html">Contatos</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-5">

        <h2>Fale com a gente</h2>

        <div class="row g-4">

            <div class="col-12 col-md-6">
                <div class="list-group">

                    <div class="list-group-item">
                        <strong>WhatsApp</strong>
                        <p class="mb-0">(12) 91111-2222</p>
                    </div>

                    <div class="list-group-item">
                        <strong>Instagram</strong>
                        <p class="mb-0">@burgivo</p>
                    </div>

                    <div class="list-group-item">
                        <strong>Endereço</strong>
                        <p class="mb-0">Rua ?, nº ? – São José dos Campos/SP</p>
                    </div>

                    <div class="list-group-item">
                        <strong>Horário de atendimento</strong>
                        <p class="mb-0">Quarta a domingo, das 18h às 3h</p>
                    </div>

                </div>
            </div>




            <div class="col-12 col-md-6">
                <h3 id="pedido">Faça seu pedido</h3>

                <form>

                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome</label>
                        <input type="text" class="form-control" id="nome" name="nome" placeholder="Seu nome" required>
                    </div>

                    <div class="mb-3">
                        <label for="telefone" class="form-label">Telefone</label>
                        <input type="tel" class="form-control" id="telefone" name="telefone" placeholder="(12) 99999-9999" required>
                    </div>

                    <div class="mb-3">
                        <label for="endereco" class="form-label">Endereço de entrega</label>
                        <input type="text" class="form-control" id="endereco" name="endereco" placeholder="Rua, número e bairro" required>
                    </div>

                    <div class="mb-3">
                        <label for="hamburguer" class="form-label">Hambúrguer</label>
                        <select class="form-select" id="hamburguer" name="hamburguer">
                            <option>X-Bacon salada - R$ 29,90</option>
                            <option>X-Salada - R$ 26,90</option>
                            <option>X-Burger - R$ 22,90</option>
                        </select>
                    </div>


                    <div class="mb-3">
                        <label for="quantidade" class="form-label">Quantidade</label>
                        <input type="number" class="form-control" id="quantidade" name="quantidade" value="1" min="1" max="20">
                    </div>

                    <div class="mb-3">
                        <label for="observacao" class="form-label">Observações</label>
                        <textarea class="form-control" id="observacao" name="observacao" rows="3" placeholder="Ex: sem cebola"></textarea>
                    </div>

                    <button type="submit" class="btn btn-enviar">Enviar pedido</button>

                </form>
            </div>

        </div>
    </main>

    <a href="https://wa.me/5512911112222" class="whatsapp" target="_blank">💬 Peça pelo WhatsApp</a>

    <footer>
        <p class="mb-0">© 2026 BURGIVO - Hambúrguer artesanal</p>
    </footer>

    

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
